name: Sync SVN to Git

on:
  # Trigger manually from the Actions tab
  workflow_dispatch:

  # Trigger automatically on a schedule (e.g., every hour)
  schedule:
    - cron: '0 * * * *' # Runs at the start of every hour

jobs:
  sync:
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
      - name: Install SVN and rsync
        run: |
          sudo add-apt-repository ppa:git-core/ppa -y
          sudo apt-get update -y
          sudo apt-get install -y rsync git-svn
          
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so tagging and branching operations work correctly
          fetch-depth: 0
          # Use a Personal Access Token (PAT) if you need to trigger other workflows
          # Or if the default GITHUB_TOKEN doesn't have enough permissions (e.g., cross-repo)
          # token: ${{ secrets.YOUR_PAT }} # Usually not needed for same-repo pushes

      - name: Configure Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Setup SSH Agent for Repo-B Access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OLEX2_GUI_DEPLOY_KEY }}


      - name: Fetch submodules
        run: |
          git submodule update --init --recursive
      
      - name: Cache .git directory
        uses: actions/cache@v4.2.3
        with:
          path: .git/modules/olex2-gui-git
          # Use a static key so the cache persists across runs
          # This allows incremental SVN fetches instead of full clones
          # Cache the actual submodule git directory (not the .git file pointer)
          key: git-svn-cache-v2
          restore-keys: |
            git-svn-cache-v2-

      - name: Initialize Git SVN (if not already initialized)
        run: |
          cd olex2-gui-git
          # Check if git-svn is already initialized
          if [ ! -d .git/svn ]; then
            echo "Git-SVN not initialized, initializing now..."
            git svn init --prefix=svn/ --trunk=trunk http://svn.olex2.org/olex2-gui
          else
            echo "Git-SVN already initialized, skipping init"
          fi
          git branch -a
          cd ..

      - name: Initialize .env file
        run: |
          # Create .env file if it doesn't exist
          if [ ! -f .env ]; then
            echo "Creating .env file with initial revisions..."
            echo "REVISION=0" > .env
            echo "REVISION_15=0" >> .env
          else
            echo ".env file already exists"
          fi

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SVN to Git Sync Script
        id: sync_script
        run: |
          # Execute your Python script, passing the workspace path as the root path
          # This follows the cron example: run the script with the root path as an argument
          python3 smaller_get.py ${{ github.workspace }}

      - name: Report Failure
        if: steps.sync_script.outcome == 'failure'
        run: echo "SVN Sync script failed. Check logs."
        # Potentially send a notification here
